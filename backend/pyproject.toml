[project]
name = "anticipa"
version = "0.1.0"
description = "Anticipa — population-level prevention autopilot (synthetic-data MVP)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "anthropic",
  "ortools>=9.11",
  "pyjwt[crypto]>=2.10",
  "argon2-cffi>=23.1",
  "orjson>=3.10",
  "psutil>=6.1",
  "python-multipart>=0.0.18",
]

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
anticipa = "anticipa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["anticipa"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --import-mode=importlib"
markers = [
  "live: calls paid external APIs (opt-in: uv run pytest -m live)",
  "integration: requires docker compose services (postgres, hapi)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
