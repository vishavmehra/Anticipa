# Anticipa Synthea configuration (applied on top of the defaults bundled in the jar via `-c`).
# Synthea v4.0.0 (see VERSION.json). Per-run values (seed, population, reference date, output dir,
# exporter.years_of_history) are passed on the command line by anticipa.datafabric.synthea.
# Rationale and measurements: Docs/benchmarks/synthea_2026-11-06.md.

# --- Export: FHIR R4 bulk NDJSON, one file per resource type -------------------------------------
exporter.fhir.export = true
exporter.fhir.bulk_data = true
exporter.fhir.use_us_core_ig = true
# Only the resource types the normalizer consumes (Claim/ExplanationOfBenefit/Provenance alone are ~55% of
# the bytes and are not used by any preventive-care rule).
exporter.fhir.included_resources = Patient,Encounter,Condition,Observation,Procedure,DiagnosticReport,Immunization,MedicationRequest,DocumentReference

# --- Disable unneeded exporters ------------------------------------------------------------------
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.ccda.export = false
exporter.csv.export = false
exporter.json.export = false
exporter.text.export = false
exporter.clinical_note.export = false
exporter.cpcds.export = false
exporter.bfd.export = false
exporter.cdw.export = false
exporter.symptoms.csv.export = false
exporter.symptoms.text.export = false
exporter.metadata.export = false

# --- Generation ----------------------------------------------------------------------------------
# One generation thread per JVM: output is then fully deterministic for a given seed, and parallelism
# comes from running --workers JVMs (bounded memory per batch).
generate.thread_pool_size = 1
# Exactly N residents per batch (deceased patients are discarded). Deceased residents are not outreach
# targets; residents.deceased_date stays supported by the schema for future datasets.
generate.only_alive_patients = true
